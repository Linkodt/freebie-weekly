# 深圳本地活动信源清单
#
# 状态：**v0.1 未接入代码**。单篇文章能抓，但拿不到一个号的完整文章列表，
# 所以按号盯需要 v0.2 的 we-mp-rss 订阅后端。先落盘，免得下次重新搜一遍。
#
# 来源：搜狗微信文章搜索（type=2）实测命中 + 各号近期真实发文的署名，
# 不是推测名单。粉丝数来自西瓜数据生活日榜，仅供参考。
#
# 打分口径：hits = 在「免费活动/本周末汇总/免费展览音乐会」这几组查询里的命中次数；
#           命中多说明它**经常发**这类内容，不说明它发得**好**。

